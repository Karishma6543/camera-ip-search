name: Desktop release artifacts

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: oxita-camera-device-manager-windows
          - os: macos-latest
            artifact: oxita-camera-device-manager-macos
          - os: ubuntu-latest
            artifact: oxita-camera-device-manager-linux-runtime-required
    steps:
      - uses: actions/checkout@v7
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.1'
          modules: 'qtwebengine qtwebchannel qtpositioning'
          cache: true
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Install application
        run: cmake --install build --config Release --prefix package
      - name: Deploy Qt runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'package/bin/camera-ip-search.exe'
          if (!(Test-Path $exe -PathType Leaf)) { throw 'Installed application executable is missing' }
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" --release --no-translations --compiler-runtime --dir (Split-Path $exe) $exe
          if ($LASTEXITCODE -ne 0) { throw 'windeployqt failed' }
          $webEngineProcess = Get-ChildItem 'package' -Recurse -Filter 'QtWebEngineProcess.exe' | Select-Object -First 1
          if (!$webEngineProcess) { throw 'QtWebEngineProcess.exe is missing from the Windows package' }
          foreach ($resource in @('qtwebengine_resources.pak', 'qtwebengine_resources_100p.pak', 'qtwebengine_resources_200p.pak', 'icudtl.dat', 'v8_context_snapshot.bin')) {
            if (!(Get-ChildItem 'package' -Recurse -Filter $resource | Select-Object -First 1)) {
              throw "Qt WebEngine resource is missing from the Windows package: $resource"
            }
          }
          $webEngineLocale = Get-ChildItem 'package' -Recurse -Filter 'en-US.pak' | Select-Object -First 1
          if (!$webEngineLocale) { throw 'Qt WebEngine locale data is missing from the Windows package' }
      - name: Deploy Qt runtime (macOS)
        if: runner.os == 'macOS'
        run: |
          APP="package/camera-ip-search.app"
          test -d "$APP"
          test -x "$APP/Contents/MacOS/camera-ip-search"
          "$QT_ROOT_DIR/bin/macdeployqt" "$APP" -always-overwrite
          WEBENGINE_PROCESS="$(find "$APP" -name 'QtWebEngineProcess*' -print -quit)"
          WEBENGINE_ENTITLEMENTS="$(find "$APP" -name 'QtWebEngineProcess.entitlements' -print -quit)"
          test -n "$WEBENGINE_PROCESS"
          test -n "$WEBENGINE_ENTITLEMENTS"
          for resource in qtwebengine_resources.pak qtwebengine_resources_100p.pak qtwebengine_resources_200p.pak icudtl.dat v8_context_snapshot.bin en-US.pak; do
            test -n "$(find "$APP" -name "$resource" -print -quit)"
          done
          ditto -c -k --sequesterRsrc --keepParent "$APP" "camera-ip-search-macos.zip"
          test -s "camera-ip-search-macos.zip"
          shasum -a 256 "camera-ip-search-macos.zip" > "camera-ip-search-macos.zip.sha256"
      - name: Archive Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path package/* -DestinationPath camera-ip-search-windows.zip
          if (!(Test-Path 'camera-ip-search-windows.zip' -PathType Leaf)) { throw 'Windows archive was not created' }
          if ((Get-Item 'camera-ip-search-windows.zip').Length -le 0) { throw 'Windows archive is empty' }
          $hash = (Get-FileHash 'camera-ip-search-windows.zip' -Algorithm SHA256).Hash.ToLower()
          "$hash  camera-ip-search-windows.zip" | Set-Content -Encoding ascii 'camera-ip-search-windows.zip.sha256'
      - name: Archive Linux package
        if: runner.os == 'Linux'
        run: |
          test -x package/bin/camera-ip-search
          tar -C package -czf camera-ip-search-linux-runtime-required.tar.gz .
          test -s camera-ip-search-linux-runtime-required.tar.gz
          sha256sum camera-ip-search-linux-runtime-required.tar.gz > camera-ip-search-linux-runtime-required.tar.gz.sha256
      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            camera-ip-search-windows.zip
            camera-ip-search-windows.zip.sha256
          if-no-files-found: error
      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            camera-ip-search-macos.zip
            camera-ip-search-macos.zip.sha256
          if-no-files-found: error
      - name: Upload Linux artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            camera-ip-search-linux-runtime-required.tar.gz
            camera-ip-search-linux-runtime-required.tar.gz.sha256
          if-no-files-found: error
