name: Desktop release artifacts

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: oxita-camera-device-manager-windows
          - os: macos-latest
            artifact: oxita-camera-device-manager-macos
          - os: ubuntu-latest
            artifact: oxita-camera-device-manager-linux-runtime-required
    steps:
      - uses: actions/checkout@v7
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.1'
          cache: true
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Install application
        run: cmake --install build --config Release --prefix package
      - name: Deploy Qt runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'package/bin/camera-ip-search.exe'
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" --release --no-translations --compiler-runtime --dir (Split-Path $exe) $exe
          if ($LASTEXITCODE -ne 0) { throw 'windeployqt failed' }
      - name: Deploy Qt runtime (macOS)
        if: runner.os == 'macOS'
        run: |
          APP="package/camera-ip-search.app"
          test -d "$APP"
          "$QT_ROOT_DIR/bin/macdeployqt" "$APP" -always-overwrite
          ditto -c -k --sequesterRsrc --keepParent "$APP" "camera-ip-search-macos.zip"
      - name: Archive Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path package/* -DestinationPath camera-ip-search-windows.zip
      - name: Archive Linux package
        if: runner.os == 'Linux'
        run: tar -C package -czf camera-ip-search-linux-runtime-required.tar.gz .
      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: camera-ip-search-windows.zip
          if-no-files-found: error
      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: camera-ip-search-macos.zip
          if-no-files-found: error
      - name: Upload Linux artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: camera-ip-search-linux-runtime-required.tar.gz
          if-no-files-found: error
